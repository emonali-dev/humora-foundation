<body data-page="contact" data-title="nav.contact" data-desc="c.contact.intro">
<a class="skip" href="#main" data-i18n="skip">Skip to main content</a>
<header id="site-header" class="site-header"><div class="container nav"><a class="brand" href="/"><img src="/assets/img/logo.svg" alt="HUMORA FOUNDATION" width="210" height="44"></a></div></header>
<main id="main">
<section class="page-hero with-photo"><div class="page-hero-photo" data-photo="about" data-ratio="2.4" data-sizes="100vw" data-eager></div><div class="container"><div class="crumbs"><a href="/" data-href="/" data-i18n="nav.home">Home</a> / <span data-i18n="nav.contact">Contact</span></div><h1 data-i18n="contact.heading">We would love to hear from you</h1><p data-i18n="c.contact.intro">Questions, partnerships or volunteering — send us a message and we will reply as soon as possible.</p></div></section>
<section class="block"><div class="container split">
  <div class="card reveal">
    <form id="contactForm" class="form" novalidate>
      <div class="row">
        <div class="field"><label for="cname"><span data-i18n="contact.name">Your name</span></label><input id="cname" name="name" autocomplete="name" maxlength="100" required></div>
        <div class="field"><label for="cemail"><span data-i18n="contact.email">Email address</span></label><input id="cemail" name="email" type="email" autocomplete="email" maxlength="160" required></div>
      </div>
      <div class="field"><label for="csubject"><span data-i18n="contact.subject">Subject</span></label><input id="csubject" name="subject" maxlength="160" required></div>
      <div class="field"><label for="cmsg"><span data-i18n="contact.message">Message</span></label><textarea id="cmsg" name="message" maxlength="4000" required></textarea></div>
      <div class="hp" aria-hidden="true"><label for="cweb">Website</label><input id="cweb" name="website" tabindex="-1" autocomplete="off"></div>
      <div id="contactMsg" role="alert" aria-live="assertive"></div>
      <button class="btn btn-green" type="submit" id="contactBtn" data-icon="mail"><span data-i18n="contact.send">Send message</span></button>
    </form>
  </div>
  <div class="reveal" id="contactInfo"><div class="spinner"></div></div>
</div></section>
